[package]
name = "copper-cloud-canvas-migrate"
description = "Moves copper-cloud's legacy canvases into a linked Canvas Cloud (import format v1), verified and idempotent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
copper-cloud-core.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
# TLS is the caller's business: `run` takes a pre-configured client (rustls + pinning live
# in copper-cloud-canvas-link). This crate only needs streamed request bodies and JSON.
reqwest = { workspace = true, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
sha2.workspace = true
# Test-only: the mock Canvas Cloud really applies the imported Yjs updates. copper-cloud
# itself does not depend on yrs.
yrs = "0.28"
